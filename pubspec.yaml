name: speedtype
description: SpeedType - Mobile Typing Speed Test
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.3

  # Ads & Monetization
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^8.0.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0

  # Local Storage
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  shared_preferences: ^2.3.2

  # Network & Sync
  connectivity_plus: ^6.0.5

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Sharing & Social
  share_plus: ^10.0.2
  appinio_social_share: ^2.4.0
  screenshot: ^3.0.0
  path_provider: ^2.1.4

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/texts/
